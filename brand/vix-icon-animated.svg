<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vix Assist">
  <defs>
    <linearGradient id="va-g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset=".55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#b44dff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 32 32;360 32 32" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="va-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="va-clip"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <style>
    .v{stroke-dasharray:64;stroke-dashoffset:64;animation:draw 1.1s .35s cubic-bezier(.22,1,.36,1) forwards}
    .n{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .6s cubic-bezier(.22,1,.36,1) forwards}
    .n1{animation-delay:.1s}.n2{animation-delay:.25s}.n3{animation-delay:1.2s}
    .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 2.4s 1.6s cubic-bezier(.22,1,.36,1) infinite}
    .sheen{animation:sheen 4.5s 1.8s cubic-bezier(.22,1,.36,1) infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{transform:scale(1)}}
    @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
    @keyframes sheen{0%{transform:translateX(-80px) skewX(-20deg)}35%,100%{transform:translateX(110px) skewX(-20deg)}}
    @media (prefers-reduced-motion:reduce){.v{animation:none;stroke-dashoffset:0}.n{animation:none;transform:none}.ring,.sheen{display:none}}
  </style>
  <rect width="64" height="64" rx="16" fill="url(#va-g)"/>
  <g clip-path="url(#va-clip)"><rect class="sheen" x="0" y="-10" width="26" height="84" fill="url(#va-sheen)"/></g>
  <path class="v" d="M17 19 L32 46 L47 19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="n n1" cx="17" cy="19" r="5.5" fill="#fff"/>
  <circle class="n n2" cx="47" cy="19" r="5.5" fill="#fff"/>
  <circle class="ring" cx="32" cy="46" r="6" fill="none" stroke="#22d3a6" stroke-width="2"/>
  <circle class="n n3" cx="32" cy="46" r="6" fill="#22d3a6" stroke="#fff" stroke-width="3"/>
</svg>
