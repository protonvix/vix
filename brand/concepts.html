<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,sans-serif;background:#eef1f7;padding:40px;width:1320px}
h1{margin:0 0 30px;font-size:28px;color:#0f172a}
.row{display:grid;grid-template-columns:60px 220px 1fr 1fr;gap:24px;align-items:center;margin-bottom:28px}
.n{font-size:44px;font-weight:800;color:#4f7cff}
.tile{background:#fff;border-radius:20px;height:200px;display:grid;place-items:center;box-shadow:0 8px 24px -12px rgba(15,23,42,.25)}
.tile.dark{background:#0b1020}
.lock{display:flex;align-items:center;gap:14px}
.word{font-size:34px;font-weight:800;color:#0f172a;letter-spacing:-.02em}
.word span{font-weight:500;color:#5b6478;margin-left:6px}
.dark .word{color:#fff}.dark .word span{color:#9aa6c2}
.cap{font-size:15px;color:#5b6478;margin-top:6px}
svg.big{width:140px;height:140px}svg.sm{width:56px;height:56px}
</style></head><body>
<h1>Vix Automations: logo concepts</h1>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
 <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#2b3fc0"/></linearGradient>
 <symbol id="A" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="url(#gA)"/>
  <path d="M17 19 L32 46 L47 19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17" cy="19" r="5.5" fill="#fff"/><circle cx="47" cy="19" r="5.5" fill="#fff"/><circle cx="32" cy="46" r="6" fill="#22d3a6" stroke="#fff" stroke-width="3"/></symbol>
 <symbol id="B" viewBox="0 0 64 64"><path d="M32 4 L56 12 V30 C56 45 46 56 32 61 C18 56 8 45 8 30 V12 Z" fill="url(#gB)"/>
  <path d="M19 24 L29 43 L46 15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="46" cy="15" r="4" fill="#22d3a6"/></symbol>
 <symbol id="C" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="url(#gA)"/>
  <path d="M50 22 A20 20 0 1 0 52 36" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M46 16 L51 22 L44 25" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 22 L32 42 L42 22" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<script>
const C={A:["Flow V","The V is a workflow: trigger → action → booked. Modern, techy."],
         B:["Shield Check","The V doubles as a checkmark inside a shield. Strongest 'trust' signal."],
         C:["Automation Loop","The V sits inside a loop arrow: 'runs on autopilot'."]};
for(const k of "ABC"){document.write(`<div class="row"><div class="n">${k}</div>
<div class="tile"><svg class="big"><use href="#${k}"/></svg></div>
<div class="tile"><div><div class="lock"><svg class="sm"><use href="#${k}"/></svg><div class="word">Vix<span>Automations</span></div></div><div class="cap"><b>${C[k][0]}</b>: ${C[k][1]}</div></div></div>
<div class="tile dark"><div class="lock"><svg class="sm"><use href="#${k}"/></svg><div class="word">Vix<span>Automations</span></div></div></div></div>`)}
</script></body></html>
