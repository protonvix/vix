<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Famous Automobile</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: var(--s6) var(--s4); }

<body>
  <main class="nf">
    <div>
      <img src="assets/logo.png" alt="Famous Automobile logo">

      <p>This page took a different exit. The showroom is still open.</p>
      <a class="btn btn--gold btn--lg" href="index.html">Back to the showroom</a>

</html>
